name: ci

# quick tier on every push and pull request; full tier + health checks weekly and on demand
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"          # Mondays 05:17 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: pytest (quick tier)
    runs-on: ubuntu-24.04      # pinned: ubuntu-latest becomes Ubuntu 26 on 19 October 2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # falsify (a public sibling repository), pinned: without it test_portfolio replaces the
      # two checks proving its regression agrees with portfolio/factor_fit by one fallback
      # check, and the agreement was only ever verified on the development machine (Session N)
      - uses: actions/checkout@v5
        with:
          repository: bredy00/falsify
          ref: 6143820fb9a3e7c44c3fd87c5d44cad68c6cf527
          path: falsify-src
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -r requirements.txt
      # falsify-src is checked out inside the workspace; pytest.ini keeps pytest out of it
      - name: licensed-data guard
        env:
          GH_TOKEN: ${{ github.token }}
          VIS: ${{ github.event.repository.visibility }}
        # a scheduled run's event carries no repository, so ask the API when VIS is empty
        run: python volsurf.py guard --ci "${VIS:-$(gh api repos/${{ github.repository }} --jq .visibility)}"
      - name: pytest -m "not slow"
        env:
          FALSIFY_PATH: ${{ github.workspace }}/falsify-src
        run: pytest -m "not slow" -q

  full:
    name: pytest (full) + health checks
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04      # pinned: ubuntu-latest becomes Ubuntu 26 on 19 October 2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # falsify (a public sibling repository), pinned: without it test_portfolio replaces the
      # two checks proving its regression agrees with portfolio/factor_fit by one fallback
      # check, and the agreement was only ever verified on the development machine (Session N)
      - uses: actions/checkout@v5
        with:
          repository: bredy00/falsify
          ref: 6143820fb9a3e7c44c3fd87c5d44cad68c6cf527
          path: falsify-src
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -r requirements.txt
      - name: restore health-check history (trend over n CI runs)
        uses: actions/cache/restore@v4
        with:
          path: captures/healthcheck_history.jsonl
          key: health-history-${{ github.run_id }}
          restore-keys: health-history-
      - name: pytest (everything)
        env:
          FALSIFY_PATH: ${{ github.workspace }}/falsify-src
        run: pytest -q
      - name: health checks with trend
        run: |
          set -o pipefail
          python healthcheck.py --md --trend | tee captures/healthcheck_ci.md
      - name: save health-check history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: captures/healthcheck_history.jsonl
          key: health-history-${{ github.run_id }}
      - name: upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: |
            captures/healthcheck.json
            captures/healthcheck_ci.md
            captures/healthcheck_history.jsonl
